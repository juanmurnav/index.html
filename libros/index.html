<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Libros · índice</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f7fbff;color:#152029;margin:0;padding:28px}
    .card{max-width:820px;margin:0 auto;background:white;padding:20px;border-radius:12px;box-shadow:0 12px 30px rgba(21,94,146,0.06)}
    h1{margin:0 0 8px}
    .note{color:#6b7882}
    a{color:#155E92;text-decoration:none;display:block;padding:10px;border-radius:8px}
    a:hover{background:#f2f7fb}
    .back{margin-top:14px;display:inline-block}
  </style>
</head>
<body>
  <div class="card">
    <h1>Libros</h1>
    <p class="note">Listado de archivos HTML dentro de la carpeta <strong>libros</strong>.</p>
    <div id="list"></div>
    <a class="back" href="../">← Volver</a>
  </div>
<script>
const OWNER='juanmurnav', REPO='index.html';
const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/libros`;
async function init(){
  try{
    const r = await fetch(apiUrl);
    const j = await r.json();
    if(!Array.isArray(j)){ document.getElementById('list').textContent='No hay contenido o error'; return; }
    const files = j.filter(f=>f.type==='file' && f.name.toLowerCase().endsWith('.html'));
    if(files.length===0){ document.getElementById('list').textContent='No se encontraron archivos .html'; return; }
    const wrap = document.getElementById('list');
    files.forEach(f=>{
      const a = document.createElement('a'); a.href = encodeURI(f.name); a.textContent = f.name; wrap.appendChild(a);
    });
  }catch(e){ console.error(e); document.getElementById('list').textContent='Error al leer carpeta.' }
}
init();
</script>
</body>
</html>
