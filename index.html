<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exámenes tipo Test · Banco de exámenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="app">

  <a class="back-link" href="../">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    Volver al panel
  </a>

  <div class="app-header">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-glyph">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="18" height="18" rx="3" stroke="white" stroke-width="1.8"/><path d="M8 12h8M12 8v8" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <span class="brand-name">Banco de exámenes</span>
      </div>
      <div class="exam-title">Exámenes tipo Test</div>
      <div class="exam-subtitle" id="fileCount">Cargando listado…</div>
    </div>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input class="search-input" id="searchInput" type="text" placeholder="Buscar por comunidad, año…">
  </div>

  <div class="file-grid" id="fileList"></div>

</div>

<script src="../assets/site.js"></script>
<script>
renderFileList({
  folder: 'carpeta',
  listEl: document.getElementById('fileList'),
  countEl: document.getElementById('fileCount'),
  searchEl: document.getElementById('searchInput')
});
</script>
</body>
</html>
