<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Selecciona carpeta · index.html</title>
  <style>
    :root{ --bg:#f4f7fb; --card:#ffffff; --accent:#155E92; --muted:#6b7882 }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#f7fbff, #eef4fa);color:#152029}
    .wrap{max-width:760px;padding:28px;text-align:center}
    .card{background:var(--card);border-radius:14px;padding:30px;box-shadow:0 8px 30px rgba(21,94,146,0.08)}
    h1{margin:0 0 12px;font-size:20px}
    p{margin:0 0 20px;color:var(--muted)}
    .choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
    a.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 20px;border-radius:10px;text-decoration:none;color:white;background:var(--accent);font-weight:600}
    a.ghost{background:transparent;color:var(--accent);border:1px solid rgba(21,94,146,0.12)}
    .note{margin-top:16px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>¿Qué carpeta quieres abrir?</h1>
      <p>Elige si quieres ver la carpeta principal del repositorio o la carpeta <strong>libros</strong>.</p>
      <div class="choices">
        <a class="btn" href="./">Abrir carpeta principal</a>
        <a class="btn ghost" href="./libros/">Abrir carpeta libros</a>
      </div>
      <div class="note">Si uno de los enlaces no funciona, revisa que el recurso exista en el repositorio.</div>
    </div>
  </div>
</body>
</html>
