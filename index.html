<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Índice de tests — juanmurnav</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;max-width:900px;margin:2rem auto;padding:0 1rem;color:#111}
    h1{font-size:1.4rem}
    .folders{display:flex;gap:0.75rem;margin:1rem 0}
    button.folder{padding:0.5rem 0.8rem;border:1px solid #ddd;background:#f7f7f8;border-radius:6px;cursor:pointer}
    button.folder.active{background:#0366d6;color:white;border-color:#0366d6}
    #files{margin-top:1rem}
    ul{padding-left:1.1rem}
    a.filelink{display:inline-block;padding:0.25rem 0.25rem;color:#0366d6}
    .note{color:#555;font-size:0.9rem}
    .error{color:#b00020}
  </style>
</head>
<body>
  <h1>Selecciona la carpeta con tests</h1>
  <p class="note">Haz clic en una carpeta para ver los tests dentro. Los archivos se abrirán en GitHub Pages (si pueden servir) o en la página del fichero en GitHub.</p>

  <div class="folders">
    <button class="folder" data-folder="Bontraeger">Bontraeger/</button>
    <button class="folder" data-folder="carpeta">carpeta/</button>
  </div>

  <div id="status" class="note">Esperando selección...</div>
  <div id="files"></div>

  <script>
    const owner = 'juanmurnav';
    const repo = 'index.html';
    const pagesBase = `https://${owner}.github.io/${repo}/`;

    const statusEl = document.getElementById('status');
    const filesEl = document.getElementById('files');
    const folderButtons = document.querySelectorAll('button.folder');

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? 'error' : 'note';
    }

    async function listFolder(folder) {
      filesEl.innerHTML = '';
      setStatus('Cargando "' + folder + '" ...');
      try {
        const api = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;
        const res = await fetch(api);
        if (res.status === 404) {
          setStatus('Carpeta "' + folder + '" no encontrada en el repositorio.', true);
          return;
        }
        if (!res.ok) throw new Error('Error al consultar GitHub API: ' + res.status);
        const items = await res.json();
        const files = items.filter(i => i.type === 'file');
        const folders = items.filter(i => i.type === 'dir');
        if (files.length === 0 && folders.length === 0) {
          setStatus('La carpeta "' + folder + '" está vacía.');
          return;
        }
        setStatus((files.length + folders.length) + ' elemento(s) en "' + folder + '".');
        const ul = document.createElement('ul');

        // First show subfolders (if any) so user can navigate deeper
        for (const d of folders) {
          const li = document.createElement('li');
          const btn = document.createElement('button');
          btn.textContent = d.name + '/';
          btn.style.background = '#f1f5f9';
          btn.style.border = '1px solid #ddd';
          btn.style.padding = '4px 8px';
          btn.style.borderRadius = '4px';
          btn.style.cursor = 'pointer';
          btn.addEventListener('click', ()=>{
            // navigate into subfolder
            listFolder(folder + '/' + d.name);
          });
          li.appendChild(btn);
          ul.appendChild(li);
        }

        // Then show files
        for (const f of files) {
          const li = document.createElement('li');
          const filename = f.name;
          const pagesUrl = pagesBase + encodeURIComponent(folder) + '/' + encodeURIComponent(filename);
          const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/HEAD/${encodeURIComponent(folder)}/${encodeURIComponent(filename)}`;
          const ghUrl = f.html_url;

          const a = document.createElement('a');
          a.className = 'filelink';
          a.textContent = filename;
          a.target = '_blank';

          const ext = filename.split('.').pop().toLowerCase();
          if (['html','htm','md','css','js','png','jpg','jpeg','svg'].includes(ext)) {
            a.href = pagesUrl;
            a.title = 'Abrir en GitHub Pages si está disponible: ' + pagesUrl + '\n(Si Pages no sirve para este fichero, usa el enlace a GitHub o raw)';

            // Also check if Pages URL likely exists by attempting a HEAD request in background; if not, switch to GH page
            (async function checkPages(aRef, gh) {
              try {
                const head = await fetch(aRef.href, {method:'HEAD'});
                if (!head.ok) aRef.href = gh; // fallback to GH file page
              } catch(e) {
                aRef.href = gh;
              }
            })(a, ghUrl);
          } else {
            a.href = ghUrl;
            a.title = 'Abrir en GitHub: ' + ghUrl;
          }

          const small = document.createElement('span');
          small.style.marginLeft = '0.6rem';
          small.innerHTML = `<a href="${rawUrl}" target="_blank" style="font-size:0.9rem;color:#444;text-decoration:none">raw</a>`;

          li.appendChild(a);
          li.appendChild(small);
          ul.appendChild(li);
        }

        filesEl.appendChild(ul);
      } catch (err) {
        console.error(err);
        setStatus('Error al listar archivos: ' + err.message, true);
      }
    }

    folderButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        folderButtons.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const folder = btn.getAttribute('data-folder');
        listFolder(folder);
      });
    });

    // If path includes folder (e.g. ?folder=Bontraeger) open it automatically
    (function autoOpenFromQuery(){
      const params = new URLSearchParams(location.search);
      const f = params.get('folder');
      if (f) {
        const btn = Array.from(folderButtons).find(b=>b.getAttribute('data-folder')===f);
        if (btn) btn.click();
        else listFolder(f);
      }
    })();
  </script>
</body>
</html>
