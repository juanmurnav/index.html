<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exámenes tipo test · Técnico Especialista en Radiodiagnóstico (TER)</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EEF2F5;
--bg-grid: #E3E9ED;
--surface:#FFFFFF;
--ink:#152029;
--ink-soft:#5B6B78;
--ink-faint:#8C99A4;
--line:#DCE3E8;
--accent:#155E92;
--accent-strong:#0E4B77;
--accent-glow: rgba(21,94,146,0.16);
--accent-glow-strong: rgba(21,94,146,0.30);
--amber:#C4841D;
--amber-bg:#FBF1DF;
--good:#1C8A5E;
--good-bg:#E4F5EC;
--good-line:#B7E3CB;
--bad:#C33F3F;
--bad-bg:#FBEAEA;
--bad-line:#F0BFBF;
--radius:14px;
--serif-mono: 'IBM Plex Mono', ui-monospace, monospace;
--sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
--shadow-card: 0 1px 2px rgba(21,32,41,0.04), 0 12px 32px -12px rgba(21,94,146,0.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
font-family: var(--sans);
background: radial-gradient(ellipse 900px 500px at 15% -10%, var(--accent-glow), transparent 60%),
radial-gradient(ellipse 700px 500px at 100% 0%, rgba(21,94,146,0.08), transparent 55%),
var(--bg);
color: var(--ink);
min-height:100vh;
-webkit-font-smoothing:antialiased;
}
a{color:inherit;}
.app{
max-width: 880px;
margin: 0 auto;
padding: 28px 20px 80px;
}
.app-header{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap: 16px;
margin-bottom: 28px;
}
.brand{
display:flex;
flex-direction:column;
gap:4px;
}
.brand-mark{
display:flex;
align-items:center;
gap:10px;
}
.brand-glyph{
width:30px;height:30px;
border-radius: 8px;
background: linear-gradient(155deg, var(--accent), var(--accent-strong));
display:flex;align-items:center;justify-content:center;
box-shadow: 0 4px 12px -4px var(--accent-glow-strong);
flex-shrink:0;
}
.brand-glyph svg{width:16px;height:16px;}
.brand-name{
font-family: var(--serif-mono);
font-size: 12.5px;
letter-spacing: 0.14em;
text-transform: uppercase;
color: var(--ink-soft);
font-weight:600;
}
.exam-title{
font-size: 20px;
font-weight: 700;
letter-spacing: -0.01em;
max-width: 46ch;
}
.exam-subtitle{
font-size: 13px;
color: var(--ink-soft);
}
.readout{
font-family: var(--serif-mono);
text-align:right;
flex-shrink:0;
}
.readout-value{
font-size: 22px;
font-weight:600;
color: var(--accent-strong);
line-height:1;
}
.readout-label{
font-size: 10.5px;
letter-spacing:0.1em;
text-transform:uppercase;
color: var(--ink-faint);
margin-top:4px;
}
.progress-track{
height:5px;
border-radius:99px;
background: var(--line);
overflow:hidden;
margin-bottom: 26px;
}
.progress-fill{
height:100%;
background: linear-gradient(90deg, var(--accent), #3F9BCF);
border-radius:99px;
transition: width .35s ease;
width:0%;
}
.screen{display:none;}
.screen.active{display:block; animation: rise .32s ease both;}
@keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.card{
background: var(--surface);
border-radius: var(--radius);
border: 1px solid var(--line);
box-shadow: var(--shadow-card);
}
.intro-card{ padding: 30px 30px 28px; margin-bottom:18px; }
.intro-eyebrow{
font-family: var(--serif-mono);
font-size:11px;
letter-spacing:0.14em;
text-transform:uppercase;
color: var(--accent);
font-weight:600;
margin-bottom:10px;
}
.intro-card h1{
font-size: 26px;
line-height:1.25;
margin: 0 0 10px;
letter-spacing:-0.01em;
}
.intro-card p{
color: var(--ink-soft);
font-size:14.5px;
line-height:1.6;
margin:0;
max-width: 62ch;
}
.intro-stats{ display:flex; gap:22px; margin-top:22px; padding-top:20px; border-top:1px dashed var(--line); }
.intro-stat b{ display:block; font-family:var(--serif-mono); font-size:20px; color:var(--ink); }
.intro-stat span{ font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; }
.option-group{ margin-bottom: 20px; }
.option-group-label{ font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color: var(--ink-soft); margin-bottom:10px; display:block; }
.pill-row{ display:flex; flex-wrap:wrap; gap:8px; }
.pill{ font-family: var(--sans); font-size:14px; font-weight:500; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink-soft); cursor:pointer; transition: all .15s ease; }
.pill:hover{ border-color: var(--accent); color:var(--ink); }
.pill.selected{ background: var(--accent); border-color: var(--accent); color:#fff; }
.toggle-row{ display:flex; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; width:fit-content; }
.toggle-opt{ padding: 10px 16px; font-size:14px; font-weight:500; cursor:pointer; color:var(--ink-soft); border-right:1px solid var(--line); }
.toggle-opt:last-child{ border-right:none; }
.toggle-opt.selected{ background:var(--accent); color:#fff; }
.check-row{ display:flex; align-items:center; gap:9px; font-size:14px; color:var(--ink-soft); cursor:pointer; user-select:none; }
.check-row input{ width:16px;height:16px; accent-color: var(--accent); cursor:pointer; }
.btn{ font-family: var(--sans); font-size:15px; font-weight:600; padding: 13px 26px; border-radius: 11px; border:none; cursor:pointer; transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease; }
.btn:active{ transform: translateY(1px); }
.btn-primary{ background: linear-gradient(155deg, var(--accent), var(--accent-strong)); color:#fff; box-shadow: 0 10px 24px -10px var(--accent-glow-strong); }
.btn-primary:hover{ box-shadow: 0 14px 28px -10px var(--accent-glow-strong); }
.btn-ghost{ background:#fff; color: var(--ink); border:1px solid var(--line); }
.btn-ghost:hover{ border-color: var(--accent); color:var(--accent-strong); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 6px;}
.quiz-card{ position:relative; padding: 34px 34px 28px; margin-bottom: 18px; }
.quiz-card::before, .quiz-card::after{ content:""; position:absolute; width:18px; height:18px; border: 2px solid var(--accent-glow-strong); opacity:.9; }
.quiz-card::before{ top:10px; left:10px; border-right:none; border-bottom:none; border-radius: 4px 0 0 0;}
.quiz-card::after{ bottom:10px; right:10px; border-left:none; border-top:none; border-radius: 0 0 4px 0;}
.q-meta{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
.q-category{ font-family: var(--serif-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color: var(--accent); background: var(--accent-glow); padding: 4px 10px; border-radius: 999px; font-weight:600; }
.flag-btn{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; color: var(--ink-faint); background:none; border:none; cursor:pointer; padding:4px 6px; }
.flag-btn svg{ width:15px; height:15px; }
.flag-btn.flagged{ color: var(--amber); }
.q-text{ font-size:18.5px; line-height:1.5; font-weight:600; letter-spacing:-0.005em; margin-bottom:22px; }
.options{ display:flex; flex-direction:column; gap:10px; }
.option{ display:flex; align-items:center; gap:14px; padding: 13px 16px; border-radius: 11px; border: 1.5px solid var(--line); background:#fff; cursor:pointer; text-align:left; font-size:15px; color: var(--ink); line-height:1.45; transition: border-color .12s ease, background .12s ease; width: 100%; }
.option:hover{ border-color: var(--accent); background: #F7FAFC; }
.option-badge{ flex-shrink:0; width:26px;height:26px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-family: var(--serif-mono); font-size:12.5px; font-weight:600; color: var(--ink-soft); background:#fff; transition: all .12s ease; }
.option.selected{ border-color: var(--accent); background: var(--accent-glow); }
.option.selected .option-badge{ background:var(--accent); border-color:var(--accent); color:#fff; }
.option.correct{ border-color: var(--good-line); background: var(--good-bg); }
.option.correct .option-badge{ background:var(--good); border-color:var(--good); color:#fff; }
.option.incorrect{ border-color: var(--bad-line); background: var(--bad-bg); }
.option.incorrect .option-badge{ background:var(--bad); border-color:var(--bad); color:#fff; }
.option.disabled{ cursor:default; }
.option.dim{ opacity:.55; }
.feedback-box{ margin-top:16px; padding: 14px; border-radius:10px; font-size:14px; line-height: 1.5; }
.feedback-box.good{ color:var(--good); background:var(--good-bg); border: 1px solid var(--good-line); }
.feedback-box.bad{ color:var(--bad); background:var(--bad-bg); border: 1px solid var(--bad-line); }
.explanation-block { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(0,0,0,0.1); color: var(--ink-soft); font-style: italic; }
.quiz-nav{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top: 18px; }
.quiz-nav .btn{ padding:11px 20px; font-size:14px; }
.nav-dots{ display:flex; gap:5px; flex-wrap:wrap; max-width:400px; justify-content:center; }
.nav-dot{ width:7px;height:7px;border-radius:50%; background: var(--line); }
.nav-dot.answered{ background: var(--accent); }
.nav-dot.current{ background: var(--accent-strong); transform:scale(1.5); }
.nav-dot.flagged{ background: var(--amber); }
.report-header{ padding: 34px 34px 26px; margin-bottom: 18px; }
.report-eyebrow{ font-family: var(--serif-mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color: var(--ink-faint); margin-bottom: 6px; }
.report-title{ font-size:22px; font-weight:700; margin-bottom: 22px; }
.score-row{ display:flex; align-items:flex-end; gap:28px; flex-wrap:wrap; }
.score-big{ font-family: var(--serif-mono); font-size:56px; font-weight:700; line-height:1; color: var(--accent-strong); }
